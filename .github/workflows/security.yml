name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '19 4 * * 1'

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  # Agent Tool Platform workflow pin:
  # 98ec8162fb11d5c04aee9e6f7b3625a472a0180d
  capability-security:
    permissions:
      contents: read
      security-events: write
      packages: read
    uses: ashergarland/agent-tool-platform/.github/workflows/capability-security.yml@98ec8162fb11d5c04aee9e6f7b3625a472a0180d

  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install 'pip-audit==2.10.1'
      - name: Audit Python runtime and provider dependencies
        run: pip-audit -r <(printf '%s\n' '.[azure,ml]')

  python-codeql:
    name: Python CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
