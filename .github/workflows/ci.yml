name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: agent-tool-server-vision:test
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run --rm -d --name vision-server -p 8080:8080 agent-tool-server-vision:test
          trap 'docker logs vision-server; docker stop vision-server' EXIT
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:8080/health && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/openapi.json
          test "$(docker inspect --format '{{.Config.User}}' vision-server)" = vision

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bicep
        run: az bicep install
      - name: Build and lint Bicep
        run: |
          az bicep build --file infra/main.bicep
          az bicep lint --file infra/main.bicep
          az bicep build-params --file infra/parameters/dev.bicepparam

