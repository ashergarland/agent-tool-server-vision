[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-tool-server-vision"
version = "0.1.0"
description = "Local FastAPI vision tool server for token-efficient image processing."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "Pillow==11.3.0",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.20",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
ml = [
  "paddleocr==3.1.0",
  "paddlepaddle==3.1.0",
]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vision_server"]

[tool.pytest.ini_options]
addopts = "--cov=vision_server --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["vision_server"]

