[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-tool-server-vision"
version = "0.3.0"
description = "Capability-owned Python vision and OCR worker for the Agent Tool Platform wrapper."
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.3.5",
  "Pillow==12.3.0",
  "pydantic-settings==2.10.1",
]

[project.optional-dependencies]
ml = [
  "paddleocr==3.7.0",
  "paddlepaddle==3.3.1",
]
azure = [
  "azure-identity==1.25.3",
  "azure-storage-blob==12.30.0",
  "httpx==0.28.1",
]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.1",
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
  "pytest-cov==6.2.1",
  "ruff==0.12.8",
]

[project.scripts]
vision-domain-worker = "vision_server.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_server"]

[tool.pytest.ini_options]
addopts = "--cov=vision_server --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["vision_server"]

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "azure.*", "paddleocr.*"]
ignore_missing_imports = true
follow_imports = "skip"
