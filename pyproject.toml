[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-tool-server-vision"
version = "0.2.0"
description = "Hybrid vision tool server exposing three token-efficient image tools over MCP and HTTP."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "mcp==2.0.0",
  "numpy==2.2.6",
  "Pillow==12.3.0",
  "pydantic-settings==2.10.1",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
ml = [
  "paddleocr==3.1.0",
  "paddlepaddle==3.1.0",
]
azure = [
  "azure-identity==1.25.3",
  "azure-storage-blob==12.30.0",
  "httpx==0.28.1",
]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "pytest-cov==6.2.1",
  "ruff==0.12.8",
]

[project.scripts]
vision-server-stdio = "vision_server.main:main_stdio"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_server"]

[tool.pytest.ini_options]
addopts = "--cov=vision_server --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["vision_server"]

[[tool.mypy.overrides]]
module = ["numpy.*", "azure.*", "paddleocr.*"]
ignore_missing_imports = true
